# GlyphLog - Local Development Infrastructure
#
# Runs PostgreSQL, API (FastAPI) and SPA (React/Vite) in Docker.

services:
  postgres:
    image: postgres:15-alpine
    container_name: glyphlog-postgres
    environment:
      POSTGRES_USER: glyphlog
      POSTGRES_PASSWORD: glyphlog
      POSTGRES_DB: glyphlog
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U glyphlog -d glyphlog"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    container_name: glyphlog-api
    user: root # Necesario para evitar problemas de permisos al escribir en uploads/ montado en el host
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    ports:
      - "8000:8000"
    volumes:
      - ./apps/api:/app
      - /app/.venv # Evita sobreescribir venv local si existe en el host
      - ./apps/api/uploads:/app/uploads # Persistencia de imágenes de portada en el host
    environment:
      - DATABASE_URL=postgresql+asyncpg://glyphlog:glyphlog@postgres:5432/glyphlog
      - SECRET_KEY=your-super-secret-key-that-is-at-least-32-chars-long-for-dev
      - ALGORITHM=HS256
      - ACCESS_TOKEN_EXPIRE_MINUTES=60
      - DEBUG=true
      - ALLOWED_ORIGINS=["http://localhost:5173", "http://127.0.0.1:5173"]
      # Client ID de Google OAuth para validar id_tokens en el backend.
      # Si está vacío, POST /api/v1/auth/google responde 503 (modo degradado).
      # El MISMO valor debe inyectarse en el servicio web como VITE_GOOGLE_CLIENT_ID.
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID:-}
      # GlyphAI (chat IA). Vacías por defecto → POST /api/v1/ai/chat responde 503.
      - AI_PROVIDER=${AI_PROVIDER:-openai}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  web:
    image: node:20-alpine
    container_name: glyphlog-web
    working_dir: /app
    command: >
      sh -c "corepack enable &&
             pnpm install --frozen-lockfile &&
             pnpm --filter web exec vite --host"
    ports:
      - "5173:5173"
    volumes:
      - .:/app
      - /app/node_modules
      - /app/apps/web/node_modules
    environment:
      - VITE_API_URL=http://localhost:8000/api/v1
      # Client ID de Google OAuth para el botón "Continuar con Google".
      # Si está vacío, el botón no se renderiza (modo degradado).
      # Debe coincidir con GOOGLE_CLIENT_ID del servicio api.
      - VITE_GOOGLE_CLIENT_ID=${VITE_GOOGLE_CLIENT_ID:-}
    depends_on:
      - api
    restart: unless-stopped

volumes:
  postgres_data:
