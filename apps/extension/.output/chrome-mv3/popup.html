<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=400, initial-scale=1.0">
  <title>GlyphLog Companion</title>
  <script type="module" crossorigin src="/chunks/popup-CKwPihIJ.js"></script>
  <link rel="stylesheet" crossorigin href="/assets/popup-9OrFIbfw.css">
</head>
<body>
  <!-- Pantalla: Emparejamiento (sin token guardado) -->
  <div id="screen-pairing" class="screen" style="display: none;">
    <header class="header">
      <div class="logo">
        <span class="logo-icon">⬡</span>
        <span class="logo-text">GlyphLog</span>
      </div>
      <p class="subtitle">Conecta tu extensión</p>
    </header>

    <div class="pairing-content">
      <p class="pairing-instructions">
        Genera un código desde <strong>GlyphLog → Perfil → Dispositivos</strong>
        e introdúcelo aquí:
      </p>
      <input id="pairing-code-input" type="text" class="input-code" maxlength="6" placeholder="A3X9K2" autocomplete="off" spellcheck="false">
      <button id="btn-pair" class="btn btn-primary" disabled>
        Emparejar
      </button>
      <p id="pairing-error" class="error-text" style="display: none;"></p>
    </div>

    <div class="settings-row">
      <label for="api-url-input" class="settings-label">URL de la API</label>
      <input id="api-url-input" type="url" class="input-url" value="http://localhost:8000" placeholder="https://tu-api.com">
    </div>
  </div>

  <!-- Pantalla: Principal (emparejado, búsqueda) -->
  <div id="screen-main" class="screen" style="display: none;">
    <header class="header header-compact">
      <div class="header-left">
        <span class="logo-icon-sm">⬡</span>
        <span class="logo-text-sm">GlyphLog</span>
      </div>
      <button id="btn-settings" class="btn-icon" title="Configuración">
        ⚙
      </button>
    </header>

    <div class="search-container">
      <input id="search-input" type="text" class="input-search" placeholder="Buscar en tu colección..." autocomplete="off" spellcheck="false">
    </div>

    <div id="entries-list" class="entries-list">
      <p class="empty-state">Busca una entrada para actualizar su progreso</p>
    </div>
  </div>

  <!-- Pantalla: Detalle de entrada -->
  <div id="screen-detail" class="screen" style="display: none;">
    <header class="header header-compact">
      <button id="btn-back" class="btn-icon" title="Volver">
        ←
      </button>
      <span id="detail-title" class="header-title">Título</span>
    </header>

    <div class="detail-content">
      <div class="detail-meta">
        <span id="detail-type" class="badge"></span>
        <span id="detail-status" class="badge badge-secondary"></span>
      </div>

      <div class="progress-section">
        <div class="progress-bar-container">
          <div id="progress-bar" class="progress-bar"></div>
        </div>
        <p id="progress-text" class="progress-text">0 / — ep.</p>
      </div>

      <div class="progress-controls">
        <button id="btn-decrement" class="btn btn-secondary btn-square">−</button>
        <input id="progress-value-input" type="number" class="input-progress" min="0">
        <button id="btn-increment" class="btn btn-secondary btn-square">+</button>
      </div>

      <div class="note-section">
        <input id="note-input" type="text" class="input-note" placeholder="Nota opcional..." maxlength="1000">
      </div>

      <div class="detail-actions">
        <button id="btn-update" class="btn btn-primary btn-full">
          Actualizar progreso
        </button>
      </div>

      <p id="detail-error" class="error-text" style="display: none;"></p>
    </div>
  </div>

  <!-- Pantalla: Configuración -->
  <div id="screen-settings" class="screen" style="display: none;">
    <header class="header header-compact">
      <button id="btn-back-settings" class="btn-icon" title="Volver">
        ←
      </button>
      <span class="header-title">Configuración</span>
    </header>

    <div class="settings-content">
      <div class="setting-item">
        <label class="settings-label">Dispositivo</label>
        <p id="device-name" class="settings-value">—</p>
      </div>
      <div class="setting-item">
        <label class="settings-label">URL de la API</label>
        <input id="settings-api-url" type="url" class="input-url" placeholder="https://tu-api.com">
      </div>
      <button id="btn-save-settings" class="btn btn-secondary btn-full">
        Guardar cambios
      </button>
      <hr class="divider">
      <button id="btn-unpair" class="btn btn-danger btn-full">
        Desvincular dispositivo
      </button>
    </div>
  </div>

  <!-- Toast de notificaciones -->
  <div id="toast" class="toast" style="display: none;">
    <span id="toast-message"></span>
  </div>

</body>
</html>
