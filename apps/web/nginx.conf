server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Gzip — reduce el tamaño de transferencia de texto y JSON
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript image/svg+xml;
    gzip_min_length 256;
    gzip_vary on;

    # Cache para assets con hash en el nombre (generados por Vite).
    # Al tener hash, son inmutables y pueden cachearse agresivamente.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # API proxy — redirige /api/* al backend FastAPI
    location /api/ {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # Uploaded images proxy — redirige /uploads/* al backend
    location /uploads/ {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SPA routing — todas las rutas que no son assets, API ni uploads
    # devuelven index.html para que React Router maneje el routing.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Health check endpoint para Docker HEALTHCHECK
    location /health {
        return 200 "OK";
        add_header Content-Type text/plain;
    }
}
