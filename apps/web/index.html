<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="GlyphLog — Registra, organiza y sigue tu colección de anime, manga y videojuegos." />
    <title>GlyphLog</title>
    <script>
      (function() {
        var theme = localStorage.getItem('glyphlog-theme');
        if (theme === 'dark') {
          document.documentElement.classList.add('dark');
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
