# ─────────────────────────────────────────────────────────────────────────────
# GlyphLog — SonarQube Project Configuration
# ─────────────────────────────────────────────────────────────────────────────
# This file configures the SonarScanner for analyzing the entire monorepo.
# To run local scan (requires sonar-scanner CLI installed or via Docker):
#   docker run --rm -v ".:/usr/src" sonarsource/sonar-scanner-cli
# ─────────────────────────────────────────────────────────────────────────────

# --- Metadatos del Proyecto ---
sonar.projectKey=glyphlog
sonar.projectName=GlyphLog
sonar.projectVersion=1.0.0

# --- Codificación de Archivos ---
sonar.sourceEncoding=UTF-8

# --- Directorios de Código ---
# Analiza tanto la API (Python) como el Frontend (TypeScript)
sonar.sources=apps/api/app,apps/web/src

# --- Directorios de Tests ---
sonar.tests=apps/api/tests,apps/web/src

# --- Patrones para emparejar Tests ---
sonar.test.inclusions=apps/api/tests/test_*.py,apps/web/src/**/*.test.ts,apps/web/src/**/*.test.tsx

# --- Exclusiones de Análisis ---
# Excluimos node_modules, entornos virtuales, builds y componentes de terceros (shadcn/ui)
# para evitar ruido y falsos positivos en el análisis.
sonar.exclusions=**/node_modules/**,**/dist/**,**/.venv/**,**/alembic/**,**/ui/**,apps/web/src/components/ui/**,apps/web/openapi.json,apps/web/src/types/api.d.ts

# --- Configuración de Lenguajes ───────────────────────────────────────────────

# TypeScript / JavaScript
sonar.javascript.environments=browser,node
sonar.typescript.tsconfigPath=apps/web/tsconfig.json

# Python
sonar.python.version=3.11

# --- Cobertura (Opcional, para integrar reportes de pytest y vitest) ---
sonar.python.coverage.reportPaths=apps/api/coverage.xml
sonar.javascript.lcov.reportPaths=apps/web/coverage/lcov.info
